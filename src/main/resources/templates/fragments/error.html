<div class="container" xmlns:th="http://www.w3.org/1999/xhtml"
     th:with="errorReportEmail=${@thymeleafSupport.getErrorReportEmail()}, backUrl=${@thymeleafSupport.getBackUrl()}">
    <script th:src="@{/scripts/timeconverter.js}"></script>
    <div class="alert alert-error" role="alert">
        <div><strong><span th:class="error-title" th:text="#{message.error.auth.title}" th:remove="tag"></span></strong>
        </div>
        <div id="error-message"></div>
        <div id="default-error-message" class="hidden aria-hidden" th:utext="#{message.error.general}"></div>
        <div id="idc-ajax-error-message" class="hidden aria-hidden" th:utext="#{message.idc.ajax-error}"></div>
        <div id="error-incident-number-wrapper">
            <span th:utext="#{label.error.incident-time('')}"></span>
            <span id="error-incident-time" th:attr="data-time-format=#{format.datetime}"></span>
            <span th:utext="#{label.error.incident-number('')}"></span>
            <span id="error-incident-number"></span>
        </div>
        <div><a id="error-report-url"
              th:href="#{label.error.error-report-content(${errorReportEmail},'(1)','(2)','(3)','(4)','(5)')}"
              th:text="#{label.error.error-report-link}">Send error report</a>
        </div>
        <div>
            <span id="error-report-notification" class="hidden"
                  th:utext="#{label.error.error-report-notification(${errorReportEmail})}"/>
        </div>
    </div>
    <div th:if="${backUrl != '#'}" class="link-back arrow-back">
        <a th:href="${backUrl}" th:text="#{label.common.back}">Back</a>
    </div>
</div>
