<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml" th:lang="${#locale.language}" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" th:with="hideHeaderLanguageSelection=true">
<head th:replace="~{fragments/head}"></head>
<body>
<div layout:fragment="content" th:with="hideHeaderLanguageSelection=true" th:remove="tag">
    <div class="container">
        <p th:text="#{message.eudi-wallet.callback-redirecting}">Redirecting, please wait...</p>
        <form id="authenticationRedirectForm" method="post" th:action="@{/auth/accept}">
            <noscript>
                <div>
                    <input type="submit" class="c-btn c-btn--primary" th:value="#{label.common.login}" value="Continue">
                </div>
            </noscript>
        </form>
    </div>
    <script th:src="@{/scripts/form-redirect.js}" defer></script>
</div>
</body>
</html>
